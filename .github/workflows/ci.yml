name: Test ve paket

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-pil python3-pytest fonts-dejavu-core
      - name: Testler
        run: python3 -m pytest -v

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Paketi oluştur
        id: build
        run: echo "deb=$(sh packaging/build-deb.sh)" >> "$GITHUB_OUTPUT"
      - name: Paketi kur ve dene
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "${{ steps.build.outputs.deb }}"
          dys-asistan --version
          python3 -c "import gi; gi.require_version('Gtk', '3.0'); import dysasistan.arayuz" || true
          timeout 10 dys-asistan --sunucu-yalniz &
          sleep 3
          curl -sf -X POST -d '{"token":"t"}' http://127.0.0.1:62222/IsAlive | grep -q alive
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://kotu.example.com' \
              -d '{"token":"t"}' http://127.0.0.1:62222/IsAlive)" = 403
          test -f /etc/xdg/autostart/io.github.muratgursel.DysAsistan.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: dys-asistan-deb
          path: dist/*.deb
      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
